[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "dsg-spacetime-runtime"
version = "0.1.0"
description = "DSG Spacetime N2N governed AI runtime source candidate"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=43.0.0",
  "pydantic>=2.8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0"]

[project.scripts]
dsg-spacetime = "dsg_spacetime.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dsg_spacetime"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
